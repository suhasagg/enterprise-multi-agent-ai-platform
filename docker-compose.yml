services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agents
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  java-tools:
    build: ./java-tools
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081

  python-ai:
    build: ./python-ai
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:agent@postgres:5432/agents
      REDIS_URL: redis://redis:6379/0
      JAVA_MCP_URL: http://java-tools:8081/mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      java-tools:
        condition: service_started
